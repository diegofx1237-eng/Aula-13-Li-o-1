<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Reserve sua Mesa</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #f4f4f9;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .form-container {
      background: #ffffff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      max-width: 600px;
      width: 100%;
    }

    .form-header h1 {
      margin-top: 0;
      color: #333;
    }

    .form-header p {
      color: #666;
      font-size: 14px;
      margin-bottom: 24px;
    }

    .campo {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
      color: #333;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="number"],
    input[type="date"],
    input[type="time"],
    select,
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }

    .name-fields {
      display: flex;
      gap: 12px;
    }

    .name-field-col {
      flex: 1;
    }

    .sub-label {
      display: block;
      font-size: 12px;
      color: #777;
      margin-top: 4px;
    }

    .section-divider {
      font-size: 18px;
      font-weight: bold;
      color: #333;
      border-bottom: 2px solid #eee;
      padding-bottom: 6px;
      margin: 28px 0 18px 0;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: #2b6cb0;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-submit:hover {
      background-color: #2c5282;
    }
  </style>
</head>
<body>

  <div class="form-container">
    <div class="form-header">
      <h1>Reserve sua Mesa</h1>
      <p>Por favor, preencha o formulário abaixo com atenção para que possamos atendê-lo da melhor forma possível. Seja bem-vindo!</p>
    </div>

    <form action="#" method="POST">
      
      <div class="campo">
        <label class="form-label" for="nome">Nome Completo</label>
        <div class="form-input-group">
          <div class="name-fields">
            <div class="name-field-col">
              <input type="text" id="nome" name="nome" required>
              <label class="sub-label" for="nome">Nome</label>
            </div>
            <div class="name-field-col">
              <input type="text" id="sobrenome" name="sobrenome" required>
              <label class="sub-label" for="sobrenome">Sobrenome</label>
            </div>
          </div>
        </div>
      </div>

      <div class="campo">
        <label class="form-label" for="email">E-mail</label>
        <div class="form-input-group">
          <input type="email" id="email" name="email" placeholder="ex: myname@example.com" required>
        </div>
      </div>

      <div class="campo">
        <label class="form-label" for="telefone">Telefone</label>
        <div class="form-input-group">
          <input type="tel" id="telefone" name="telefone" placeholder="(11) 99999-9999" required>
        </div>
      </div>

      <div class="campo">
        <label class="form-label" for="pessoas">Número de Pessoas</label>
        <div class="form-input-group">
          <input type="number" id="pessoas" name="pessoas" min="1" required>
        </div>
      </div>

      <div class="section-divider">
        Reserva
      </div>

      <div class="campo">
        <label class="form-label" for="tipo_reserva">Tipo de Reserva</label>
        <div class="form-input-group">
          <select id="tipo_reserva" name="tipo_reserva" required>
            <option value="" disabled selected>Selecione uma opção</option>
            <option value="almoco">Almoço</option>
            <option value="jantar">Jantar</option>
            <option value="aniversario">Aniversário / Evento</option>
            <option value="outro">Outro</option>
          </select>
        </div>
      </div>

      <div class="campo">
        <label class="form-label" for="data_reserva">Data da Reserva</label>
        <div class="form-input-group">
          <input type="date" id="data_reserva" name="data_reserva" required>
        </div>
      </div>

      <div class="campo">
        <label class="form-label" for="horario_reserva">Horário</label>
        <div class="form-input-group">
          <input type="time" id="horario_reserva" name="horario_reserva" required>
        </div>
      </div>

      <div class="campo">
        <label class="form-label" for="observacoes">Observações (opcional)</label>
        <div class="form-input-group">
          <textarea id="observacoes" name="observacoes" rows="3" placeholder="Alguma restrição alimentar ou preferência de mesa?"></textarea>
        </div>
      </div>

      <button type="submit" class="btn-submit">Confirmar Reserva</button>

    </form>
  </div>

</body>
</html>
